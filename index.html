<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WW3: GLOBAL CONFLICT SIMULATOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE VARIABLES & RESET --- */
        :root {
            --c-bg: #050505;
            --c-panel: rgba(16, 20, 24, 0.85);
            --c-accent: #ff9d00; /* Tactical Orange */
            --c-alert: #ff2a2a;
            --c-text: #e8e8e8;
            --c-grid: rgba(255, 255, 255, 0.03);
            --font-ui: 'Rajdhani', sans-serif;
            --font-fa: 'Vazirmatn', sans-serif;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--c-bg);
            color: var(--c-text);
            font-family: var(--font-fa);
            height: 100vh;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Background Grid Animation */
        .bg-grid {
            position: fixed; inset: 0; z-index: -1;
            background-image: 
                linear-gradient(var(--c-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--c-grid) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            animation: gridMove 20s linear infinite;
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed; inset: 0; z-index: 9999;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.8s var(--ease-out);
        }

        .loader-logo {
            font-family: var(--font-ui);
            font-size: 3rem; font-weight: 700;
            letter-spacing: 8px; text-transform: uppercase;
            color: var(--c-accent);
            text-shadow: 0 0 20px rgba(255, 157, 0, 0.5);
            margin-bottom: 40px;
        }

        .progress-track {
            width: 300px; height: 4px;
            background: #222; border-radius: 2px;
            overflow: hidden; position: relative;
        }

        .progress-bar {
            height: 100%; width: 0%;
            background: var(--c-accent);
            box-shadow: 0 0 10px var(--c-accent);
            transition: width 0.3s ease;
        }

        .sys-log {
            margin-top: 20px;
            font-family: var(--font-ui);
            font-size: 0.8rem; color: #666;
            letter-spacing: 2px; min-height: 1.2em;
        }

        /* --- MAIN MENU --- */
        #main-menu {
            display: none; opacity: 0;
            height: 100%; width: 100%;
            flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s var(--ease-out);
        }

        .menu-title {
            font-family: var(--font-ui);
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 700; text-transform: uppercase;
            line-height: 1; margin-bottom: 60px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .menu-subtitle {
            font-size: 1rem; color: var(--c-accent);
            letter-spacing: 6px; margin-top: 10px;
            text-align: center; display: block;
        }

        /* PROFESSIONAL 3D BUTTONS */
        .btn-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 320px; }

        .tactical-btn {
            position: relative;
            padding: 22px 30px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-family: var(--font-ui); font-size: 1.3rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 0.2s var(--ease-out);
            transform-style: preserve-3d;
            display: flex; align-items: center; gap: 15px;
        }

        .tactical-btn::before {
            content: ''; position: absolute; inset: 0;
            background: var(--c-accent); opacity: 0;
            transition: opacity 0.3s; z-index: -1;
        }

        .tactical-btn:hover {
            transform: translateY(-3px) translateZ(10px);
            border-color: var(--c-accent);
            box-shadow: 0 10px 30px rgba(255, 157, 0, 0.2);
        }
        .tactical-btn:hover::before { opacity: 0.1; }
        .tactical-btn:active { transform: translateY(2px) scale(0.98); }

        .btn-icon { 
            width: 24px; height: 24px; 
            fill: currentColor; opacity: 0.8;
        }

        /* --- REGISTRATION MODAL --- */
        #reg-modal {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s;
        }

        .reg-card {
            width: 90%; max-width: 400px;
            background: var(--c-panel);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; position: relative;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            transform: translateY(30px); transition: transform 0.5s var(--ease-out);
        }

        .reg-card h2 {
            font-family: var(--font-ui); color: var(--c-accent);
            margin-bottom: 30px; font-size: 1.8rem;
        }

        .input-group { margin-bottom: 20px; position: relative; }
        
        .input-group input {
            width: 100%; padding: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #333; color: #fff;
            font-family: var(--font-fa); font-size: 1rem;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--c-accent); box-shadow: 0 0 10px rgba(255,157,0,0.2); }
        .input-group label {
            position: absolute; right: 15px; top: 15px;
            color: #666; pointer-events: none; transition: 0.3s;
            font-size: 0.9rem;
        }
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -10px; right: 10px; font-size: 0.7rem;
            color: var(--c-accent); background: #111; padding: 0 5px;
        }

        .close-reg {
            position: absolute; top: 15px; left: 15px;
            background: none; border: none; color: #666;
            font-size: 1.5rem; cursor: pointer;
        }

        /* --- 3D ERROR ALERT --- */
        #error-overlay {
            position: fixed; inset: 0; z-index: 3000;
            background: rgba(20, 0, 0, 0.8);
            display: none; align-items: center; justify-content: center;
            perspective: 800px;
        }

        .error-card {
            background: linear-gradient(135deg, #2a0000, #1a0000);
            border: 2px solid var(--c-alert);
            padding: 40px; text-align: center;
            max-width: 350px;
            box-shadow: 0 0 50px rgba(255, 42, 42, 0.3), inset 0 0 30px rgba(255,0,0,0.1);
            transform: rotateX(10deg) scale(0.9);
            opacity: 0; transition: all 0.4s var(--ease-out);
        }

        .error-icon { font-size: 3rem; margin-bottom: 15px; display: block; }
        .error-msg { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
        .error-sub { font-size: 0.8rem; color: var(--c-alert); letter-spacing: 1px; }

        @keyframes gridMove { to { background-position: 40px 40px; } }
        @keyframes shake { 
            0%, 100% { transform: rotateX(10deg) translateX(0); } 
            20% { transform: rotateX(10deg) translateX(-10px); } 
            40% { transform: rotateX(10deg) translateX(10px); } 
            60% { transform: rotateX(10deg) translateX(-5px); } 
            80% { transform: rotateX(10deg) translateX(5px); } 
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <!-- CINEMATIC LOADER -->
    <div id="loader">
        <div class="loader-logo">WW3 SIM</div>
        <div class="progress-track"><div class="progress-bar" id="p-bar"></div></div>
        <div class="sys-log" id="sys-log">INITIALIZING KERNEL...</div>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu">
        <h1 class="menu-title">
            WORLD WAR III
            <span class="menu-subtitle">GLOBAL CONFLICT SIMULATOR</span>
        </h1>

        <div class="btn-container">
            <button class="tactical-btn" onclick="gameAction('start')">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4l6 13H6l6-13z"/></svg>
                شروع عملیات
            </button>
            <button class="tactical-btn" onclick="gameAction('campaign')">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                کمپین جهانی
            </button>
            <button class="tactical-btn" id="btn-auth" onclick="openAuth()">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                ثبت فرماندهی
            </button>
        </div>
    </div>

    <!-- REGISTRATION FORM -->
    <div id="reg-modal">
        <div class="reg-card">
            <button class="close-reg" onclick="closeAuth()">×</button>
            <h2>ثبت نام فرمانده</h2>
            <form onsubmit="handleRegister(event)">
                <div class="input-group">
                    <input type="text" id="cmd-name" placeholder=" " required autocomplete="off">
                    <label>نام عملیاتی (Callsign)</label>
                </div>
                <div class="input-group">
                    <input type="password" id="cmd-pass" placeholder=" " required>
                    <label>کد دسترسی امنیتی</label>
                </div>
                <button type="submit" class="tactical-btn" style="width:100%; justify-content:center; margin-top:10px;">
                    تایید هویت
                </button>
            </form>
        </div>
    </div>

    <!-- 3D ERROR OVERLAY -->
    <div id="error-overlay" onclick="dismissError()">
        <div class="error-card" id="err-card">
            <span class="error-icon">⚠️</span>
            <div class="error-msg">دسترسی غیرمجاز</div>
            <div class="error-sub">شما هنوز ثبت نام نکرده‌اید</div>
        </div>
    </div>

<script>
    // --- STATE MANAGEMENT ---
    const state = {
        authenticated: false,
        commander: null
    };

    // --- CINEMATIC LOADER LOGIC ---
    const logs = [
        "LOADING TACTICAL MAPS...",
        "CONNECTING TO SATELLITE UPLINK...",
        "DECRYPTING ENEMY PROTOCOLS...",
        "CALIBRATING NUCLEAR YIELD...",
        "SYSTEM READY."
    ];
    
    let p = 0;
    const pBar = document.getElementById('p-bar');
    const sysLog = document.getElementById('sys-log');
    
    const loadInterval = setInterval(() => {
        p += Math.random() * 15;
        if(p > 100) p = 100;
        pBar.style.width = p + '%';
        
        const logIndex = Math.min(Math.floor(p / 25), logs.length - 1);
        sysLog.innerText = logs[logIndex];

        if(p === 100) {
            clearInterval(loadInterval);
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    const menu = document.getElementById('main-menu');
                    menu.style.display = 'flex';
                    requestAnimationFrame(() => menu.style.opacity = '1');
                }, 800);
            }, 600);
        }
    }, 400);

    // --- AUTH SYSTEM ---
    function openAuth() {
        if(state.authenticated) return;
        const modal = document.getElementById('reg-modal');
        modal.style.display = 'flex';
        requestAnimationFrame(() => {
            modal.style.opacity = '1';
            modal.querySelector('.reg-card').style.transform = 'translateY(0)';
        });
    }

    function closeAuth() {
        const modal = document.getElementById('reg-modal');
        modal.style.opacity = '0';
        modal.querySelector('.reg-card').style.transform = 'translateY(30px)';
        setTimeout(() => modal.style.display = 'none', 400);
    }

    function handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById('cmd-name').value;
        if(name.length < 3) return;

        state.authenticated = true;
        state.commander = name;
        
        // Update UI
        const btn = document.getElementById('btn-auth');
        btn.innerHTML = `<svg class="btn-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> ${name}`;
        btn.style.borderColor = '#0f0';
        btn.style.color = '#0f0';
        
        closeAuth();
    }

    // --- GAME ACTIONS & ERROR HANDLING ---
    function gameAction(type) {
        if(!state.authenticated) {
            triggerError();
            return;
        }
        console.log(`Starting ${type} as ${state.commander}`);
        // Game logic here
    }

    function triggerError() {
        const overlay = document.getElementById('error-overlay');
        const card = document.getElementById('err-card');
        overlay.style.display = 'flex';
        
        requestAnimationFrame(() => {
            overlay.style.opacity = '1'; // Note: add transition to overlay in CSS if needed
            card.style.opacity = '1';
            card.style.transform = 'rotateX(0deg) scale(1)';
            card.style.animation = 'shake 0.5s ease-in-out';
        });
    }

    function dismissError() {
        const overlay = document.getElementById('error-overlay');
        const card = document.getElementById('err-card');
        card.style.opacity = '0';
        card.style.transform = 'rotateX(10deg) scale(0.9)';
        setTimeout(() => {
            overlay.style.display = 'none';
            card.style.animation = 'none';
        }, 300);
    }
</script>

</body>
</html>
