
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WW3: COMMAND CENTER</title>
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Vazirmatn:wght@300;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. CORE VARIABLES & RESET
           ========================================= */
        :root {
            --c-bg: #030303;
            --c-surface: rgba(15, 18, 22, 0.9);
            --c-primary: #ff9d00;   /* Tactical Amber */
            --c-danger: #ff2a2a;
            --c-success: #00ff88;
            --c-text-main: #ffffff;
            --c-text-muted: #6e7681;
            --c-border: rgba(255, 255, 255, 0.08);
            
            --font-display: 'Rajdhani', sans-serif;
            --font-body: 'Vazirmatn', sans-serif;
            
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.23, 1, 0.32, 1);
            
            --glow-primary: 0 0 20px rgba(255, 157, 0, 0.4);
            --glow-danger: 0 0 20px rgba(255, 42, 42, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--c-bg);
            color: var(--c-text-main);
            font-family: var(--font-body);
            height: 100vh; width: 100vw;
            overflow: hidden;
            perspective: 1500px;
        }

        /* =========================================
           2. BACKGROUND FX ENGINE
           ========================================= */
        #bg-canvas {
            position: fixed; inset: 0; z-index: 0;
            opacity: 0.4; pointer-events: none;
        }

        .scanline {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            opacity: 0.3;
        }

        .vignette {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, #000 100%);
        }

        /* =========================================
           3. LOADING SEQUENCE
           ========================================= */
        #boot-sequence {
            position: fixed; inset: 0; z-index: 9999;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s var(--ease-smooth);
        }

        .boot-logo {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700; letter-spacing: 10px;
            color: var(--c-primary);
            text-shadow: var(--glow-primary);
            margin-bottom: 50px;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .boot-progress {
            width: min(400px, 80vw); height: 2px;
            background: #222; position: relative;
        }
        .boot-bar {
            height: 100%; width: 0%; background: var(--c-primary);
            box-shadow: var(--glow-primary);
            transition: width 0.2s linear;
        }
        .boot-log {
            margin-top: 20px; font-family: var(--font-display);
            font-size: 0.8rem; color: var(--c-text-muted);
            letter-spacing: 3px; min-height: 1.5em;
        }

        /* =========================================
           4. MAIN MENU SYSTEM
           ========================================= */
        #command-center {
            position: relative; z-index: 10;
            height: 100%; width: 100%;
            display: none; opacity: 0;
            grid-template-columns: 1fr auto;
            grid-template-rows: auto 1fr auto;
            padding: clamp(20px, 4vw, 60px);
            transition: opacity 1.2s var(--ease-smooth);
        }

        /* Header */
        .header-stats {
            grid-column: 1 / -1;
            display: flex; gap: 30px;
            font-family: var(--font-display);
            font-size: 0.9rem; color: var(--c-text-muted);
            letter-spacing: 2px; border-bottom: 1px solid var(--c-border);
            padding-bottom: 20px; margin-bottom: 20px;
        }
        .stat-item span { color: var(--c-primary); margin-right: 8px; }

        /* Center Content */
        .menu-core {
            grid-column: 1; grid-row: 2;
            display: flex; flex-direction: column;
            justify-content: center; max-width: 500px;
        }

        .title-block h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 7vw, 5.5rem);
            line-height: 0.9; font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8));
        }
        .title-block .subtitle {
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            color: var(--c-primary); letter-spacing: 8px;
            margin-top: 15px; display: block;
        }

        /* TACTICAL BUTTONS */
        .nav-stack {
            margin-top: 60px; display: flex;
            flex-direction: column; gap: 15px;
        }

        .tac-btn {
            position: relative;
            padding: 20px 35px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--c-border);
            color: #fff; font-family: var(--font-display);
            font-size: 1.4rem; font-weight: 600;
            letter-spacing: 3px; text-transform: uppercase;
            cursor: pointer; overflow: hidden;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            transition: all 0.3s var(--ease-smooth);
            display: flex; align-items: center; gap: 20px;
        }

        .tac-btn::before {
            content: ''; position: absolute; left: 0; top: 0;
            width: 4px; height: 100%; background: var(--c-primary);
            opacity: 0; transition: opacity 0.3s;
        }

        .tac-btn:hover {
            background: rgba(255, 157, 0, 0.08);
            border-color: var(--c-primary);
            transform: translateX(10px);
            box-shadow: var(--glow-primary);
        }
        .tac-btn:hover::before { opacity: 1; }
        .tac-btn:active { transform: translateX(10px) scale(0.98); }

        .btn-icon { width: 28px; height: 28px; fill: currentColor; opacity: 0.7; }

        /* FLAG SELECTOR (Bottom Left) */
        .flag-dock {
            grid-column: 1; grid-row: 3;
            display: flex; align-items: flex-end; gap: 20px;
            padding-top: 40px;
        }

        .selected-flag {
            width: 80px; height: 50px;
            background: #222; border: 1px solid var(--c-border);
            position: relative; cursor: pointer;
            overflow: hidden; transition: 0.3s;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
        }
        .selected-flag img { width: 100%; height: 100%; object-fit: cover; }
        .selected-flag:hover { border-color: var(--c-primary); box-shadow: var(--glow-primary); }
        
        .flag-label {
            font-family: var(--font-display);
            font-size: 0.8rem; color: var(--c-text-muted);
            letter-spacing: 2px;
        }
        .flag-name { color: #fff; font-size: 1.1rem; margin-top: 5px; }

        /* =========================================
           5. AUTH & MODAL SYSTEM
           ========================================= */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s;
        }

        .auth-panel {
            width: min(450px, 90vw);
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            padding: 50px; position: relative;
            clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
            transform: translateY(40px) scale(0.95);
            transition: all 0.5s var(--ease-elastic);
        }

        .auth-tabs {
            display: flex; gap: 30px; margin-bottom: 40px;
            border-bottom: 1px solid var(--c-border);
        }
        .auth-tab {
            padding-bottom: 15px; font-family: var(--font-display);
            font-size: 1.2rem; letter-spacing: 2px;
            color: var(--c-text-muted); cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }
        .auth-tab.active { color: var(--c-primary); border-color: var(--c-primary); }

        .form-group { margin-bottom: 25px; position: relative; }
        .form-input {
            width: 100%; padding: 18px 15px;
            background: rgba(0,0,0,0.4);
            border: 1px solid #333; color: #fff;
            font-family: var(--font-body); font-size: 1rem;
            transition: 0.3s;
        }
        .form-input:focus { border-color: var(--c-primary); box-shadow: 0 0 15px rgba(255,157,0,0.15); }
        
        .form-label {
            position: absolute; right: 15px; top: 18px;
            color: var(--c-text-muted); pointer-events: none;
            transition: 0.3s var(--ease-smooth);
        }
        .form-input:focus ~ .form-label,
        .form-input:not(:placeholder-shown) ~ .form-label {
            top: -10px; right: 10px; font-size: 0.7rem;
            color: var(--c-primary); background: var(--c-surface);
            padding: 0 8px; letter-spacing: 1px;
        }

        /* FLAG GRID IN MODAL */
        .flag-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px; max-height: 200px; overflow-y: auto;
            margin-top: 10px; padding: 5px;
        }
        .flag-option {
            aspect-ratio: 3/2; background: #222;
            border: 1px solid #333; cursor: pointer;
            transition: 0.2s; position: relative;
        }
        .flag-option img { width: 100%; height: 100%; object-fit: cover; }
        .flag-option.selected { border-color: var(--c-primary); box-shadow: var(--glow-primary); }
        .flag-option.selected::after {
            content: '✓'; position: absolute; inset: 0;
            background: rgba(255,157,0,0.3);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff;
        }

        /* =========================================
           6. 3D ERROR SYSTEM
           ========================================= */
        #alert-system {
            position: fixed; inset: 0; z-index: 3000;
            display: none; align-items: center; justify-content: center;
            background: rgba(30, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }
        .alert-card {
            background: linear-gradient(135deg, #2a0505, #1a0000);
            border: 2px solid var(--c-danger);
            padding: 50px; text-align: center;
            max-width: 400px;
            box-shadow: var(--glow-danger), inset 0 0 40px rgba(255,0,0,0.1);
            transform: perspective(800px) rotateX(10deg) scale(0.9);
            opacity: 0; transition: all 0.4s var(--ease-elastic);
        }
        .alert-icon { font-size: 4rem; margin-bottom: 20px; display: block; filter: drop-shadow(0 0 10px var(--c-danger)); }
        .alert-title { font-family: var(--font-display); font-size: 2rem; color: #fff; margin-bottom: 10px; }
        .alert-msg { color: var(--c-danger); letter-spacing: 1px; }

        @keyframes shake3D {
            0%, 100% { transform: perspective(800px) rotateX(0deg) translateX(0); }
            20% { transform: perspective(800px) rotateX(5deg) translateX(-15px); }
            40% { transform: perspective(800px) rotateX(-5deg) translateX(15px); }
            60% { transform: perspective(800px) rotateX(3deg) translateX(-8px); }
            80% { transform: perspective(800px) rotateX(-3deg) translateX(8px); }
        }

        /* RESPONSIVE ADJUSTMENTS */
        @media (max-width: 768px) {
            #command-center { grid-template-columns: 1fr; padding: 20px; }
            .header-stats { font-size: 0.7rem; gap: 15px; }
            .title-block h1 { font-size: 3rem; }
            .tac-btn { padding: 18px 25px; font-size: 1.1rem; }
            .flag-dock { position: fixed; bottom: 20px; left: 20px; padding: 0; }
        }
    </style>
</head>
<body>

    <!-- BG EFFECTS -->
    <canvas id="bg-canvas"></canvas>
    <div class="scanline"></div>
    <div class="vignette"></div>

    <!-- BOOT SEQUENCE -->
    <div id="boot-sequence">
        <div class="boot-logo">WW3 SIM</div>
        <div class="boot-progress"><div class="boot-bar" id="boot-bar"></div></div>
        <div class="boot-log" id="boot-log">INITIALIZING KERNEL...</div>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="command-center">
        <div class="header-stats">
            <div class="stat-item"><span>DEFCON</span> 3</div>
            <div class="stat-item"><span>SERVER</span> EU-WEST-2</div>
            <div class="stat-item"><span>PING</span> 24ms</div>
            <div class="stat-item" id="user-display" style="margin-inline-start:auto; color:#fff;">GUEST MODE</div>
        </div>

        <div class="menu-core">
            <div class="title-block">
                <h1>WORLD WAR III<br>SIMULATOR</h1>
                <span class="subtitle">TACTICAL COMMAND INTERFACE</span>
            </div>

            <nav class="nav-stack">
                <button class="tac-btn" onclick="App.navigate('campaign')">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    کمپین جهانی
                </button>
                <button class="tac-btn" onclick="App.navigate('multiplayer')">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    نبرد چند نفره
                </button>
                <button class="tac-btn" onclick="App.navigate('intel')">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>

                </button>
                <button class="tac-btn" id="btn-auth-trigger" onclick="App.openAuth()">

                </button>
            </nav>
        </div>

        <div class="flag-dock">
            <div class="selected-flag" onclick="App.openFlagSelector()">
                <img id="current-flag-img" src="https://flagcdn.com/w160/un.png" alt="UN Flag">
            </div>
            <div>
                <div class="flag-label">FACTION SELECTED</div>
                <div class="flag-name" id="current-flag-name">UNITED NATIONS</div>
            </div>
        </div>
    </div>

    <!-- AUTH MODAL -->
    <div class="modal-overlay" id="auth-modal">
        <div class="auth-panel">
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="App.switchTab('login')">ورود</div>
                <div class="auth-tab" onclick="App.switchTab('register')">ثبت نام</div>
            </div>

            <!-- LOGIN FORM -->
            <form id="form-login" onsubmit="App.handleLogin(event)">
                <div class="form-group">
                    <input type="email" class="form-input" placeholder=" " required>
                    <label class="form-label">ایمیل سازمانی</label>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" placeholder=" " required>
                    <label class="form-label">کد رمز عبور</label>
                </div>
                <button type="submit" class="tac-btn" style="width:100%; justify-content:center;">تایید هویت</button>
            </form>

            <!-- REGISTER FORM -->
            <form id="form-register" style="display:none;" onsubmit="App.handleRegister(event)">
                <div class="form-group">
                    <input type="text" id="reg-name" class="form-input" placeholder=" " required minlength="3">
                    <label class="form-label">نام فرمانده (Callsign)</label>
                </div>
                <div class="form-group">
                    <input type="email" id="reg-email" class="form-input" placeholder=" " required>
                    <label class="form-label">ایمیل امنیتی</label>
                </div>
                <div class="form-group">
                    <input type="password" id="reg-pass" class="form-input" placeholder=" " required minlength="6">
                    <label class="form-label">رمز عبور</label>

                <div class="form-group">

                </div>
                <button type="submit" class="tac-btn" style="width:100%; justify-content:center;">ثبت نهایی</button>
            </form>

            <button onclick="App.closeAuth()" style="position:absolute; top:20px; left:20px; background:none; border:none; color:#666; font-size:2rem; cursor:pointer;">×</button>
        </div>
    </div>

    <!-- FLAG SELECTOR MODAL -->
    <div class="modal-overlay" id="flag-modal">
        <div class="auth-panel" style="max-width:600px;">
            <h2 style="font-family:var(--font-display); color:var(--c-primary); margin-bottom:30px;">SELECT FACTION</h2>
            <div class="flag-grid" id="main-flag-grid" style="max-height:400px;"></div>
            <button onclick="document.getElementById('flag-modal').style.display='none'" class="tac-btn" style="width:100%; justify-content:center; margin-top:30px;">تایید</button>
        </div>
    </div>

    <!-- 3D ALERT -->
    <div id="alert-system" onclick="App.dismissAlert()">
        <div class="alert-card" id="alert-card">
            <span class="alert-icon">⚠️</span>
            <div class="alert-title">ACCESS DENIED</div>
            <div class="alert-msg">شما هنوز ثبت نام نکرده‌اید</div>
        </div>
    </div>

<script>
/**
 * WW3 SIMULATOR - CORE ENGINE
 * Professional Grade Frontend Architecture
 */

// --- DATA: COUNTRIES & FLAGS ---
const COUNTRIES = [
    { code: 'us', name: 'ایالات متحده آمریکا' },
    { code: 'ru', name: 'روسیه' },
    { code: 'cn', name: 'چین' },
    { code: 'ir', name: 'جمهوری اسلامی ایران' },
    { code: 'gb', name: 'بریتانیا' },
    { code: 'fr', name: 'فرانسه' },
    { code: 'de', name: 'آلمان' },
    { code: 'il', name: 'اسرائیل' },
    { code: 'sa', name: 'عربستان سعودی' },
    { code: 'tr', name: 'ترکیه' },
    { code: 'in', name: 'هند' },
    { code: 'pk', name: 'پاکستان' },
    { code: 'kp', name: 'کره شمالی' },
    { code: 'kr', name: 'کره جنوبی' },
    { code: 'jp', name: 'ژاپن' },
    { code: 'ua', name: 'اوکراین' },
    { code: 'br', name: 'برزیل' },
    { code: 'eg', name: 'مصر' },
];

// --- STATE MANAGEMENT ---
const Store = {
    state: {
        authenticated: false,
        user: null,
        selectedCountry: { code: 'un', name: 'UNITED NATIONS' },
        currentTab: 'login'
    },
    
    set(key, value) {
        this.state[key] = value;
        this.persist();
    },
    
    persist() {
        localStorage.setItem('ww3_sim_data', JSON.stringify(this.state));
    },
    
    load() {
        const saved = localStorage.getItem('ww3_sim_data');
        if (saved) {
            try { Object.assign(this.state, JSON.parse(saved)); } catch(e) {}
        }
    }
};

// --- PARTICLE BACKGROUND ENGINE ---
class ParticleSystem {
    constructor() {
        this.canvas = document.getElementById('bg-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.init();
        this.animate();
    }
    
    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }
    
    init() {
        for(let i=0; i<80; i++) {
            this.particles.push({
                x: Math.random() * this.canvas.width,
                y: Math.random() * this.canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.5 + 0.1
            });
        }
    }
    
    animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.fillStyle = '#ff9d00';
        
        this.particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
            if(p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
            
            this.ctx.globalAlpha = p.alpha;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            this.ctx.fill();
        });
        
        // Draw connections
        this.ctx.strokeStyle = '#ff9d00';
        this.ctx.lineWidth = 0.5;
        for(let i=0; i<this.particles.length; i++) {
            for(let j=i+1; j<this.particles.length; j++) {
                const dx = this.particles[i].x - this.particles[j].x;
                const dy = this.particles[i].y - this.particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 120) {
                    this.ctx.globalAlpha = (1 - dist/120) * 0.2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.particles[i].x, this.particles[i].y);
                    this.ctx.lineTo(this.particles[j].x, this.particles[j].y);
                    this.ctx.stroke();
                }
            }
        }
        requestAnimationFrame(() => this.animate());
    }
}

// --- APPLICATION CONTROLLER ---
const App = {
    init() {
        Store.load();
        new ParticleSystem();
        this.bootSequence();
        this.renderFlags();
        this.updateUI();
    },
    
    bootSequence() {
        const logs = [
            "LOADING TACTICAL ASSETS...",
            "ESTABLISHING SECURE UPLINK...",
            "DECRYPTING GLOBAL MAP DATA...",
            "CALIBRATING DEFENSE SYSTEMS...",
            "AUTHENTICATING BIOMETRICS...",
            "SYSTEM OPERATIONAL."
        ];
        
        let progress = 0;
        const bar = document.getElementById('boot-bar');
        const logEl = document.getElementById('boot-log');
        
        const interval = setInterval(() => {
            progress += Math.random() * 12 + 3;
            if(progress > 100) progress = 100;
            bar.style.width = progress + '%';
            
            const logIdx = Math.min(Math.floor(progress / 18), logs.length - 1);
            logEl.innerText = logs[logIdx];
            
            if(progress === 100) {
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('boot-sequence').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('boot-sequence').style.display = 'none';
                        const menu = document.getElementById('command-center');
                        menu.style.display = 'grid';
                        requestAnimationFrame(() => menu.style.opacity = '1');
                    }, 1000);
                }, 800);
            }
        }, 300);
    },
    
    renderFlags() {
        const createFlagHTML = (country, onClick) => `
            <div class="flag-option" data-code="${country.code}" onclick="${onClick}">
                <img src="https://flagcdn.com/w160/${country.code}.png" alt="${country.name}" loading="lazy">
            </div>
        `;
        
        // Render for registration
        document.getElementById('flag-grid').innerHTML = 
            COUNTRIES.map(c => createFlagHTML(c, `App.selectRegCountry('${c.code}', '${c.name}')`)).join('');
            
        // Render for main selector
        document.getElementById('main-flag-grid').innerHTML = 
            COUNTRIES.map(c => createFlagHTML(c, `App.selectMainCountry('${c.code}', '${c.name}')`)).join('');
    },
    
    selectRegCountry(code, name) {
        document.querySelectorAll('#flag-grid .flag-option').forEach(el => el.classList.remove('selected'));
        document.querySelector(`#flag-grid [data-code="${code}"]`).classList.add('selected');
        document.getElementById('reg-country').value = JSON.stringify({code, name});
    },
    
    selectMainCountry(code, name) {
        Store.set('selectedCountry', {code, name});
        this.updateFlagDisplay();
        document.getElementById('flag-modal').style.display = 'none';
    },
    
    updateFlagDisplay() {
        const c = Store.state.selectedCountry;
        document.getElementById('current-flag-img').src = `https://flagcdn.com/w160/${c.code}.png`;
        document.getElementById('current-flag-name').innerText = c.name;
    },
    
    openFlagSelector() {
        const modal = document.getElementById('flag-modal');
        modal.style.display = 'flex';
        requestAnimationFrame(() => modal.style.opacity = '1');
    },
    
    // --- AUTH SYSTEM ---
    openAuth() {
        if(Store.state.authenticated) return;
        const modal = document.getElementById('auth-modal');
        modal.style.display = 'flex';
        requestAnimationFrame(() => {
            modal.style.opacity = '1';
            modal.querySelector('.auth-panel').style.transform = 'translateY(0) scale(1)';
        });
    },
    
    closeAuth() {
        const modal = document.getElementById('auth-modal');
        modal.style.opacity = '0';
        modal.querySelector('.auth-panel').style.transform = 'translateY(40px) scale(0.95)';
        setTimeout(() => modal.style.display = 'none', 400);
    },
    
    switchTab(tab) {
        Store.state.currentTab = tab;
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        
        document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    },
    
    handleLogin(e) {
        e.preventDefault();
        // Simulate API call
        setTimeout(() => {
            Store.set('authenticated', true);
            Store.set('user', { name: 'COMMANDER', email: e.target[0].value });
            this.closeAuth();
            this.updateUI();
        }, 800);
    },
    
    handleRegister(e) {
        e.preventDefault();
        const countryVal = document.getElementById('reg-country').value;
        if(!countryVal) {
            this.showAlert("لطفاً یک کشور را انتخاب کنید");
            return;
        }
        
        setTimeout(() => {
            const country = JSON.parse(countryVal);
            Store.set('authenticated', true);
            Store.set('user', { 
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value 
            });
            Store.set('selectedCountry', country);
            this.closeAuth();
            this.updateUI();
            this.updateFlagDisplay();
        }, 1000);
    },
    
    updateUI() {
        if(Store.state.authenticated && Store.state.user) {
            const btn = document.getElementById('btn-auth-trigger');
            btn.innerHTML = `<svg class="btn-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> ${Store.state.user.name}`;
            btn.style.borderColor = 'var(--c-success)';
            btn.style.color = 'var(--c-success)';
            btn.onclick = null;
            
            document.getElementById('user-display').innerText = `${Store.state.user.name} | ${Store.state.selectedCountry.name}`;
        } else {
            this.updateFlagDisplay();
        }
    },
    
    navigate(section) {
        if(!Store.state.authenticated) {
            this.showAlert("شما هنوز ثبت نام نکرده‌اید");
            return;
        }
        console.log(`Navigating to ${section}...`);
        // Game logic routing here
    },
    
    showAlert(msg) {
        const overlay = document.getElementById('alert-system');
        const card = document.getElementById('alert-card');
        overlay.style.display = 'flex';
        
        requestAnimationFrame(() => {
            card.style.opacity = '1';
            card.style.transform = 'perspective(800px) rotateX(0deg) scale(1)';
            card.style.animation = 'shake3D 0.6s ease-in-out';
            card.querySelector('.alert-msg').innerText = msg;
        });
    },
    
    dismissAlert() {
        const card = document.getElementById('alert-card');
        card.style.opacity = '0';
        card.style.transform = 'perspective(800px) rotateX(10deg) scale(0.9)';
        card.style.animation = 'none';
        setTimeout(() => {
            document.getElementById('alert-system').style.display = 'none';
        }, 300);
    }
};

// Initialize when DOM is ready
window.addEventListener('DOMContentLoaded', () => App.init());
</script>
