<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>درخواست ترجمه | مانیسو</title>

<meta name="description" content="درخواست ترجمه مانهوا در سایت مانیسو">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
font-family:Vazirmatn;
}


body{

margin:0;

background:#07070b;

color:white;

}



/* HEADER */

header{

height:80px;

background:#101015;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 7%;

border-bottom:1px solid #ffffff12;

}



.logo{

font-size:36px;

font-weight:900;

color:#ffc400;

text-shadow:0 0 20px #ffc400;

}



.home{

color:white;

text-decoration:none;

transition:.3s;

}



.home:hover{

color:#ffc400;

}





/* BOX */


.request-box{

max-width:650px;

margin:70px auto;

background:#111116;

border:1px solid #292933;

border-radius:25px;

padding:40px;

box-shadow:0 0 40px #000;

}




h1{

text-align:center;

color:#ffc400;

font-size:35px;

}



p{

color:#aaa;

text-align:center;

}




input, textarea{


width:100%;

margin-top:20px;

padding:16px;

background:#171720;

border:1px solid #333;

border-radius:15px;

color:white;

font-size:16px;

outline:none;

}




textarea{

height:130px;

resize:none;

}





button{


width:100%;

margin-top:25px;

padding:16px;

background:#ffc400;

border:none;

border-radius:30px;

font-weight:900;

font-size:16px;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:scale(1.03);

box-shadow:0 0 25px #ffc400;

}




#success{

display:none;

margin-top:25px;

padding:20px;

background:#ffc40022;

border-radius:15px;

color:#ffc400;

text-align:center;

}




footer{

margin-top:100px;

padding:30px;

background:#101015;

text-align:center;

color:#777;

}



</style>


</head>


<body>



<header>


<div class="logo">

مانیـسو

</div>


<a class="home" href="index.html">

خانه

</a>


</header>





<div class="request-box">


<h1>

درخواست ترجمه مانهوا

</h1>


<p>

مانهوا مورد نظر خود را وارد کنید تا توسط تیم مانیسو بررسی شود ✨

</p>




<input id="name" placeholder="نام مانهوا">





<textarea id="desc" placeholder="توضیحات درباره مانهوا (اختیاری)"></textarea>





<button onclick="sendRequest()">

ارسال درخواست

</button>





<div id="success">

✅ درخواست شما برای ادمین‌های مانیسو ارسال شد.

<br>

به زودی بررسی و در صورت امکان ترجمه و در سایت قرار خواهد گرفت.

</div>



</div>





<footer>

© 2026 Maniso

<br>

دنیای مانهوا فارسی ❤️‍🔥

</footer>






<script>


function sendRequest(){


let name =
document.getElementById("name").value;



if(name==""){

alert("لطفاً نام مانهوا را وارد کنید");

return;

}



document.getElementById("success")
.style.display="block";



}


</script>



</body>

</html>
