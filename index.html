<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WW3 Simulator: Gifty Hap</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Vazirmatn:wght@400;700&display=swap');

        :root {
            --neon-green: #0f0;
            --neon-red: #f00;
            --dark-metal: #111;
            --panel-bg: rgba(20, 20, 20, 0.95);
            --depth: 20px;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            background: #000;
            color: var(--neon-green);
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
            height: 100vh;
            perspective: 1000px;
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        .radar {
            width: 150px;
            height: 150px;
            border: 2px solid var(--neon-green);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 20px var(--neon-green), inset 0 0 20px var(--neon-green);
        }

        .radar::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 50%; height: 2px;
            background: var(--neon-green);
            transform-origin: left;
            animation: scan 2s linear infinite;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .load-text {
            font-family: 'Orbitron', sans-serif;
            margin-top: 30px;
            letter-spacing: 5px;
            animation: blink 1s steps(2) infinite;
        }

        /* --- MAIN MENU --- */
        #menu {
            display: none;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 20px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-red), 0 0 30px var(--neon-red);
            color: #fff;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 3px;
        }

        /* 3D BUTTONS */
        .btn-3d {
            width: 280px;
            padding: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #fff;
            background: linear-gradient(180deg, #333, #111);
            border: 1px solid #444;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn-3d::before {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            transform: translateZ(calc(var(--depth) * -1));
            filter: brightness(0.6);
        }

        .btn-3d::after {
            content: '';
            position: absolute;
            width: var(--depth);
            height: 100%;
            background: #222;
            right: -10px; 
            top: 10px;
            transform: rotateY(90deg);
            transform-origin: left;
        }

        .btn-3d:active {
            transform: translateZ(-10px) translateY(5px);
        }

        .btn-icon {
            font-size: 1.5rem;
            animation: floatIcon 3s ease-in-out infinite;
        }

        /* --- 3D ERROR MODAL --- */
        #error-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        .error-box {
            width: 300px;
            padding: 30px;
            background: #1a0000;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            text-align: center;
            transform-style: preserve-3d;
            transform: rotateX(10deg) rotateY(-10deg);
            box-shadow: 10px 10px 30px rgba(255,0,0,0.3);
            animation: shake3D 0.5s ease;
        }

        .error-title {
            font-family: 'Orbitron';
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--neon-red);
        }

        /* ANIMATIONS */
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes shake3D { 
            0%, 100% { transform: rotateX(10deg) rotateY(-10deg); } 
            25% { transform: rotateX(10deg) rotateY(5deg); } 
            75% { transform: rotateX(-5deg) rotateY(-10deg); } 
        }

    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <div class="radar"></div>
        <div class="load-text">INITIALIZING WAR PROTOCOL...</div>
    </div>

    <!-- MAIN MENU -->
    <div id="menu">
        <h1>WORLD WAR III<br><span style="font-size:0.5em; color:var(--neon-green)">SIMULATOR</span></h1>
        
        <button class="btn-3d" onclick="handleAction('start')">
            <span class="btn-icon">⚔️</span> شروع نبرد
        </button>
        
        <button class="btn-3d" onclick="handleAction('campaign')">
            <span class="btn-icon">🌍</span> کمپین جهانی
        </button>
        
        <button class="btn-3d" onclick="openRegister()">
            <span class="btn-icon">🪖</span> ثبت نام فرمانده
        </button>
    </div>

    <!-- 3D ERROR MODAL -->
    <div id="error-modal" onclick="this.style.display='none'">
        <div class="error-box">
            <div class="error-title">⛔ ACCESS DENIED</div>
            <p>شما هنوز ثبت نام نکرده‌اید!</p>
            <small style="opacity:0.7; margin-top:10px; display:block;">[ برای بستن کلیک کنید ]</small>
        </div>
    </div>

<script>
    // شبیه‌سازی وضعیت کاربر
    let isLoggedIn = false;

    // لودینگ اولیه
    window.addEventListener('load', () => {
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
                const menu = document.getElementById('menu');
                menu.style.display = 'flex';
                // تریگر ریفلو برای انیمیشن فید
                void menu.offsetWidth; 
                menu.style.opacity = '1';
            }, 800);
        }, 2500);
    });

    // هندل کردن اکشن‌ها
    function handleAction(type) {
        if (!isLoggedIn) {
            showError();
            return;
        }
        // منطق بازی در اینجا قرار می‌گیرد
        alert(`وارد بخش ${type} شدید...`);
    }

    // نمایش ارور سه‌بعدی
    function showError() {
        const modal = document.getElementById('error-modal');
        modal.style.display = 'flex';
        // ریست کردن انیمیشن لرزش
        const box = modal.querySelector('.error-box');
        box.style.animation = 'none';
        void box.offsetWidth;
        box.style.animation = 'shake3D 0.5s ease';
    }

    // شبیه‌سازی ثبت نام
    function openRegister() {
        const username = prompt("نام فرمانده خود را وارد کنید:");
        if (username && username.length > 2) {
            isLoggedIn = true;
            document.querySelector('.btn-3d:last-child').innerHTML = `<span class="btn-icon">✅</span> خوش آمدید: ${username}`;
            document.querySelector('.btn-3d:last-child').style.borderColor = 'var(--neon-green)';
            document.querySelector('.btn-3d:last-child').style.color = 'var(--neon-green)';
        }
    }
</script>

</body>
</html>
